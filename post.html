<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post | Gabriel Montes</title>
    <link rel="stylesheet" href="css/style.css">

    <script>
        window.MathJax = {
            tex: {
                // Backslash math only: \( \) inline, \[ \] display.
                // No $ or $$ delimiters, so a bare money dollar sign
                // in prose (e.g. $100 in travel.md) is inert and can
                // never be paired as math.
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.2/marked.min.js"></script>

    <style>
        /* Dark theme: inherit css/style.css instead of forcing white.
           The old rule forced a white background here, after the
           css/style.css link, so it overrode the dark theme on every
           post page. Removing it lets the rest of the site's
           dark theme apply. */
        body { background-color: var(--bg); color: var(--text); }

        #markdown-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            background: transparent;
        }

        .back-button {
            display: inline-block;
            margin: 0 0 20px 0;
            padding: 8px 14px;
            border: 1px solid #1e293b;
            border-radius: 6px;
            background: var(--card);
            color: var(--accent);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        #markdown-content a {
            color: var(--accent);
        }

        /* Image styling */
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
            border: 1px solid #1e293b;
            border-radius: 4px;
        }

        /* Code block styling - dark, to match the rest of the site */
        pre {
            background: var(--card);
            color: var(--text);
            padding: 15px;
            overflow-x: auto;
            border-radius: 5px;
            border: 1px solid #1e293b;
        }

        #markdown-content code {
            color: var(--accent);
            background: var(--card);
            padding: 2px 4px;
            border-radius: 3px;
        }

        #markdown-content pre code {
            background: transparent;
            padding: 0;
            color: var(--text);
        }
    </style>
</head>
<body>

    <nav>
        <div class="container">
            <a href="index.html" class="logo-link" style="text-decoration:none; font-weight:bold;">G.MONTES</a>
        </div>
    </nav>

    <main class="container">
        <a id="back-link" href="technical_blog.html" class="back-button">← Back to Technical Blog</a>
        <article id="markdown-content">Loading content...</article>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('markdown-content');

            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file');

            // Back button: target follows the post being loaded,
            // so technical posts go back to the technical blog and
            // personal posts go back to the personal blog. This also
            // works for direct links, where browser history is empty.
            const backLink = document.getElementById('back-link');
            if (backLink && fileName) {
                if (fileName.startsWith('personal_blog/')) {
                    backLink.href = 'personal_blog.html';
                    backLink.textContent = '\u2190 Back to Personal Blog';
                } else {
                    backLink.href = 'technical_blog.html';
                    backLink.textContent = '\u2190 Back to Technical Blog';
                }
            }

            if (!fileName) {
                container.innerHTML = "<h1>Error</h1><p>No file specified in URL.</p>";
                return;
            }

            // 1. Calculate the folder where the markdown file lives
            // e.g. "technical_blog_folder/sports_betting/"
            const basePath = fileName.substring(0, fileName.lastIndexOf('/') + 1);

            fetch(fileName + '?v=' + Date.now())
                .then(res => {
                    if (!res.ok) throw new Error(`Status ${res.status}: ${res.statusText}`);
                    return res.text();
                })
                .then(markdown => {
                    // --- STEP 1: PROTECT MATH ---
                    // Backslash math only: protect \[ ... \] first,
                    // then \( ... \). No $ protection is needed, because
                    // MathJax no longer treats $ as a delimiter, so
                    // money dollars in prose pass through untouched.
                    const mathStorage = [];
                    // Protect \[ ... \] (display math, may span lines)
                    let protectedText = markdown.replace(/\\\[([\s\S]*?)\\\]/g, (match) => {
                        mathStorage.push(match);
                        return `%%%MATH_BLOCK_${mathStorage.length - 1}%%%`;
                    });
                    // Protect \( ... \)
                    protectedText = protectedText.replace(/\\\(([\s\S]*?)\\\)/g, (match) => {
                        mathStorage.push(match);
                        return `%%%MATH_INLINE_${mathStorage.length - 1}%%%`;
                    });

                    // --- STEP 2: PARSE MARKDOWN TO HTML ---
                    let html = marked.parse(protectedText);

                    // --- STEP 3: RESTORE MATH ---
                    html = html.replace(/%%%MATH_BLOCK_(\d+)%%%/g, (match, i) => mathStorage[i]);
                    html = html.replace(/%%%MATH_INLINE_(\d+)%%%/g, (match, i) => mathStorage[i]);

                    // --- STEP 4: INJECT HTML ---
                    container.innerHTML = html;

                    // --- STEP 5: FIX IMAGES (DOM MANIPULATION) ---
                    // This is the robust fix. We grab the rendered <img> tags and update their src.
                    const images = container.querySelectorAll('img');
                    images.forEach(img => {
                        const rawSrc = img.getAttribute('src');
                        // If the image source is relative (e.g. "image.png"), prepend the folder path
                        if (rawSrc && !rawSrc.startsWith('http') && !rawSrc.startsWith('/')) {
                            img.src = basePath + rawSrc;
                            console.log(`Fixed image path: ${rawSrc} -> ${img.src}`);
                        }
                    });

                    // --- STEP 6: RENDER MATH ---
                    // The MathJax script tag above no longer has async,
                    // so MathJax should already be loaded here. Retry
                    // briefly anyway, in case a CDN load is slow, instead
                    // of silently skipping math as the old code did.
                    const typesetMath = () => {
                        if (window.MathJax && window.MathJax.typesetPromise) {
                            MathJax.typesetPromise([container]).catch(err => console.error(err));
                        }
                    };
                    if (window.MathJax) {
                        typesetMath();
                    } else {
                        let attempts = 0;
                        const timer = setInterval(() => {
                            attempts++;
                            if (window.MathJax) {
                                clearInterval(timer);
                                typesetMath();
                            } else if (attempts > 50) {
                                clearInterval(timer);
                            }
                        }, 100);
                    }
                })
                .catch(err => {
                    console.error(err);
                    container.innerHTML = `<div style="color:red; border:1px solid red; padding:20px;">
                        <h3>Error Loading Post</h3>
                        <p>${err.message}</p>
                    </div>`;
                });
        });
    </script>
</body>
</html>
